name: Cataclysm Windows build (MSYS2)

on:
  push:
    branches:
    - upload
    paths-ignore:
    - 'android/**'
    - 'build-data/osx/**'
    - 'doc/**'
    - 'doxygen_doc/**'
    - 'gfx/**'
    - 'lang/**'
    - 'lgtm/**'
    - 'msvc-object_creator/**'
    - 'object_creator/**'
    - 'tools/**'
    - '!tools/format/**'
    - 'utilities/**'
  pull_request:
    branches:
    - upload
    paths-ignore:
    - 'android/**'
    - 'build-data/osx/**'
    - 'doc/**'
    - 'doxygen_doc/**'
    - 'gfx/**'
    - 'lang/**'
    - 'lgtm/**'
    - 'msvc-object_creator/**'
    - 'object_creator/**'
    - 'tools/**'
    - '!tools/format/**'
    - 'utilities/**'

# We only care about the latest revision of a PR, so cancel previous instances.
concurrency:
  group: msys2-build-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build_catatclysm:
    name: Build
    runs-on: windows-2019
    if: github.event.pull_request.draft == false

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 1

    - name: Setup MSYS2
      # Will by default install MINGW64
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install:
          - git
          - make
          - mingw-w64-x86_64-astyle
          - mingw-w64-x86_64-gcc
          - mingw-w64-x86_64-libmad
          - mingw-w64-x86_64-libwebp
          - mingw-w64-x86_64-pkg-config
          - mingw-w64-x86_64-SDL2
          - mingw-w64-x86_64-SDL2_image
          - mingw-w64-x86_64-SDL2_mixer
          - mingw-w64-x86_64-SDL2-ttf

    - name: Build
      run: |
        make -j$((`nproc`+0)) TILES=1 SOUND=1 

    - name: Compile .mo files for localization
      run: |
          make localization

    - name: Run tests
      run: |
          .\tests\cata_test.exe --rng-seed time
